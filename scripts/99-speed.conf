# 安装位置: /etc/sysctl.d/99-speed.conf
#
# 为什么改这个（关键洞察）：
#   UA3F 是"终结式"代理 —— 它自己作为客户端去连远端服务器，
#   所以"路由器 ↔ 远端"这一段 TCP 的拥塞控制和缓冲区由**路由器内核**决定，
#   而不是由你的电脑决定。
#
#   默认 cubic + 176KB 接收缓冲，在 200~300ms 的国际线路上，
#   单连接吞吐会被死死限制在几 Mbps（窗口 ÷ RTT）。
#   换成 BBR + 4MB 缓冲后，欧洲源下载实测从 2.7 MB/s 提升到 5.3 MB/s。
#
# 前置: opkg install kmod-tcp-bbr

net.ipv4.tcp_congestion_control=bbr
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_rmem=4096 87380 4194304
net.ipv4.tcp_wmem=4096 65536 4194304
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_slow_start_after_idle=0
